<style>
/* Layout: manager console on the left, boarding-pass style offer card on the right.
   The offer card keeps one fixed look in both themes so screenshots are identical. */
:root{
  --bg:#EDF1F5; --surface:#FFFFFF; --surface-2:#E3E9EF; --ink:#0E2236; --muted:#556779; --line:#D3DCE5;
  --accent:#1F5FD6; --accent-ink:#FFFFFF; --accent-soft:#DCE7FB;
  --ok:#12794A; --ok-soft:#DCF2E6; --warn:#8F5600; --warn-soft:#FBEACB; --bad:#B3261E; --bad-soft:#FADCD9;
  --card-bg:#FFFFFF; --card-ink:#0B1F33; --card-muted:#566879; --card-line:#DDE5EC; --card-soft:#F1F5F8;
  --card-head:#0B1F33; --card-head-ink:#FFFFFF; --card-head-2:#12304D;
  --card-fee:#8294A6; --card-a:#2C6BF2; --card-b:#14B8C4; --card-gift:#A9C3F4; --card-ok:#0F8A55; --card-ok-soft:#DDF4E9;
  --card-pop:#7CF0C7;
  --font-display:'LS Inter Display','Inter Display','Inter',system-ui,sans-serif; --font-body:'LS Inter','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1620; --surface:#12212E; --surface-2:#1B2E3F; --ink:#E6EEF5; --muted:#96A8B9; --line:#26394B;
    --accent:#6C9CF5; --accent-ink:#0A1620; --accent-soft:#1D3354;
    --ok:#5CCB93; --ok-soft:#143527; --warn:#E6B45E; --warn-soft:#3A2D12; --bad:#F2938B; --bad-soft:#401B18;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1620; --surface:#12212E; --surface-2:#1B2E3F; --ink:#E6EEF5; --muted:#96A8B9; --line:#26394B;
  --accent:#6C9CF5; --accent-ink:#0A1620; --accent-soft:#1D3354;
  --ok:#5CCB93; --ok-soft:#143527; --warn:#E6B45E; --warn-soft:#3A2D12; --bad:#F2938B; --bad-soft:#401B18;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:1060px;margin:0 auto}
button,input,textarea{font-family:inherit}

.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin-bottom:20px}
.top h1{font:700 22px/1.15 var(--font-display);margin:0;letter-spacing:-.01em}
.top p{margin:3px 0 0;color:var(--muted);font-size:13px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);font:600 14px var(--font-body);padding:9px 14px;border-radius:9px;cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.18)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.grid{display:grid;grid-template-columns:minmax(0,390px) minmax(0,1fr);gap:24px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:18px;min-width:0}
.sec{display:flex;flex-direction:column;gap:12px;min-width:0}
.sec>h3{margin:0;font:700 12px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.how{margin:0;font-size:13px;color:var(--muted)}
.how b{color:var(--ink)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lbl{font-size:13px;font-weight:600}
input[type=text],textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:16px;min-height:44px}
textarea{font-size:13px;line-height:1.5;resize:vertical}
input::placeholder{color:var(--muted);opacity:.7}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 12px;border-radius:12px;cursor:pointer;min-height:44px;display:inline-flex;flex-direction:column;align-items:flex-start;text-align:left;font-size:14px}
.chip b{font-weight:600}
.chip span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] span{color:inherit;opacity:.85}

.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--font-body);padding:10px 14px;border-radius:10px;cursor:pointer;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;color:var(--muted);padding-inline:8px}
details>summary{cursor:pointer;font-weight:600;font-size:13px;min-height:32px;display:flex;align-items:center}
details[open]>summary{margin-bottom:10px}
.note{margin:0;font-size:12px;color:var(--muted);line-height:1.4}

.hints{display:flex;flex-direction:column;gap:10px}
.hints:empty{display:none}
.hint{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start;font-size:13px;line-height:1.4}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:6px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.info{background:var(--accent-soft);color:var(--accent)}
.what{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.what th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;text-align:right;padding:0 0 6px 6px}
.what th:first-child,.what td:first-child{text-align:left;padding-left:0}
.what td{padding:7px 0 7px 6px;border-top:1px solid var(--line);text-align:right}
.what tr.ok td:last-child{color:var(--ok);font-weight:700} .what tr.bad td:nth-child(3){color:var(--bad)} .what tr.warn td:nth-child(3){color:var(--warn)}
.what tr.cur td:first-child{font-weight:700}
.tbl-scroll{overflow-x:auto}

/* ---------- Offer card ---------- */
.stage{min-width:0}
.card{max-width:580px;width:100%;margin:0 auto;background:var(--card-bg);color:var(--card-ink);border-radius:24px;overflow:hidden;box-shadow:0 1px 0 var(--card-line),0 26px 50px -26px rgba(8,25,45,.6)}
.pass{position:relative;background:radial-gradient(120% 90% at 100% 0%,var(--card-head-2) 0%,var(--card-head) 62%);color:var(--card-head-ink);padding:20px 22px 20px;overflow:hidden}
.pass>*{position:relative}
.arc{position:absolute;right:-6px;top:40px;width:210px;height:90px;opacity:.55;pointer-events:none}
.pass-top{display:flex;justify-content:space-between;gap:12px;font:600 11.5px var(--font-body);letter-spacing:.09em;text-transform:uppercase;opacity:.78}
.eyebrow{margin:22px 0 4px;font:600 15px/1.3 var(--font-body);opacity:.9;max-width:20em}
.hero-num{font:800 clamp(44px,13vw,64px)/1 var(--font-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums;background:linear-gradient(95deg,#FFFFFF 10%,var(--card-pop) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block;padding-bottom:4px}
.hero-sub{margin:6px 0 0;font-size:13.5px;opacity:.82;line-height:1.4}
.hero-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip-gift{display:inline-block;font:600 14px var(--font-body);padding:6px 13px;border-radius:999px;border:1.5px dashed rgba(255,255,255,.55);color:var(--card-head-ink)}
.badge{display:inline-block;font:700 14px var(--font-body);padding:7px 13px;border-radius:999px;background:var(--card-pop);color:#06301F}
.badge.flat{background:rgba(255,255,255,.14);color:var(--card-head-ink)}
.pass-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:12px;border-top:1px dashed rgba(255,255,255,.3);margin-top:20px;padding-top:14px}
.pf small{display:block;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;opacity:.62;margin-bottom:2px}
.pf b{font:700 16px/1.2 var(--font-display);font-variant-numeric:tabular-nums}
.cb{padding:24px 22px;display:flex;flex-direction:column;gap:28px}
.sh{margin:0 0 12px;font:700 12px var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--card-muted)}

.b-row{display:flex;flex-direction:column;gap:6px}
.b-row+.b-row{margin-top:18px}
.b-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.b-name{font-weight:600}
.b-val{font:700 22px var(--font-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.b-track{position:relative;height:20px}
.b-fill{display:flex;height:100%;background:var(--card-soft);border-radius:10px;overflow:hidden}
.f-fee{background:var(--card-fee)}
.f-rev{background:linear-gradient(90deg,var(--card-a),var(--card-b))}
.f-gift{background:repeating-linear-gradient(135deg,var(--card-gift) 0 4px,#CFE0FA 4px 8px)}
.b-mark{position:absolute;top:-5px;bottom:-5px;width:0;border-left:2px dashed var(--card-ink);opacity:.5}
.b-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--card-muted);min-height:24px}
.pill{font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--card-soft);color:var(--card-muted);white-space:nowrap}
.pill.up{background:var(--card-ok-soft);color:var(--card-ok)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:16px;font-size:12px;color:var(--card-muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend .l-line{width:0;height:12px;border-radius:0;border-left:2px dashed var(--card-ink);opacity:.5;margin-right:8px}
.ifn{margin:16px 0 0;padding:10px 14px;border-radius:12px;background:var(--card-soft);font-size:14px}
.ifn b{font-family:var(--font-display)}

.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.steps li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}
.steps .n{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--card-a),var(--card-b));color:#fff;font:700 15px/34px var(--font-display);text-align:center}
.steps b{display:block;font:700 16px/1.25 var(--font-display)}
.steps span{font-size:13.5px;color:var(--card-muted);line-height:1.4}

.gets{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.get{background:var(--card-soft);border-radius:14px;padding:12px 14px}
.get b{display:block;font:700 17px/1.2 var(--font-display);margin-bottom:2px}
.get span{font-size:13px;color:var(--card-muted);line-height:1.35}
.gets .get:last-child:nth-child(odd){grid-column:1/-1}

.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sp{background:var(--card-soft);border-radius:14px;padding:12px 12px}
.sp small{display:block;font-size:12px;color:var(--card-muted)}
.sp b{display:block;font:700 clamp(15px,4.3vw,19px)/1.2 var(--font-display);margin-top:3px;font-variant-numeric:tabular-nums}
.strip-note{margin:10px 0 0;font-size:12.5px;color:var(--card-muted)}

.close{background:var(--card-head);color:var(--card-head-ink);padding:20px 22px}
.close b{display:block;font:700 19px/1.25 var(--font-display);text-wrap:balance}
.close span{display:block;margin-top:6px;font-size:13px;opacity:.78;line-height:1.45}
.close .k{margin:0 0 12px;font:700 11.5px var(--font-body);letter-spacing:.09em;text-transform:uppercase;opacity:.7}
.sum{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1.2fr);gap:8px;align-items:end;margin-bottom:20px}
.sum small{display:block;font-size:11.5px;opacity:.72;line-height:1.25;margin-bottom:3px}
.sum b{display:block;font:700 clamp(14px,4.2vw,19px)/1.15 var(--font-display);font-variant-numeric:tabular-nums}
.sum i{font:600 20px/1 var(--font-display);opacity:.5;font-style:normal;padding-bottom:2px}
.sum .tot b{color:var(--card-pop);font-size:clamp(18px,5.4vw,26px)}
.actions{max-width:580px;margin:14px auto 0;display:flex;flex-wrap:wrap;gap:10px}
.actions .btn{flex:1 1 200px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(6,16,26,.74);display:flex;align-items:flex-start;justify-content:center;overflow:auto;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal[hidden]{display:none}
.mbox{background:var(--surface);color:var(--ink);border-radius:18px;max-width:540px;width:100%;padding:16px;display:flex;flex-direction:column;gap:12px;margin:auto}
.mbox>b{font:700 17px var(--font-display)}
.mbox img{width:100%;height:auto;border-radius:12px;display:block;background:var(--surface-2)}
.mbox .btns .btn{flex:1 1 140px}
.mbox textarea{min-height:240px}
.empty{padding:36px 22px;text-align:center;color:var(--card-muted)}
.empty h2{font:700 20px var(--font-display);color:var(--card-ink);margin:0 0 8px}

.app[data-mode="blogger"] .grid{grid-template-columns:minmax(0,1fr)}
.app[data-mode="blogger"] .panel{display:none}
.app[data-mode="blogger"] .top>div:first-child{display:none}
.app[data-mode="blogger"] .top{justify-content:flex-end}

@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:420px){
  .cb{padding:20px 16px;gap:26px}
  .pass{padding:18px 16px 18px}
  .close{padding:18px 16px}
  .b-val{font-size:19px}
  .two{grid-template-columns:1fr}
  .arc{display:none}
}

/* language switch + typography tweaks (Inter) */
.ctrls{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.seg.lang button{padding:9px 11px;min-width:44px;letter-spacing:.03em}
.pf b,.steps b,.get b,.sp b,.sum b{font-family:var(--font-body)}
.top h1{letter-spacing:-.02em}
.two{align-items:end}
.hero-num{letter-spacing:-.02em}
</style>

<div class="app" id="app" data-mode="manager">
  <header class="top">
    <div>
      <h1 data-k="h1"></h1>
      <p data-k="sub"></p>
    </div>
    <div class="ctrls">
      <div class="seg lang" role="group" data-aria="langAria">
        <button type="button" id="langRu" aria-pressed="true" lang="ru">RU</button>
        <button type="button" id="langEn" aria-pressed="false" lang="en">EN</button>
      </div>
      <div class="seg" role="group" data-aria="viewAria">
        <button type="button" id="modeM" aria-pressed="true" data-k="modeM"></button>
        <button type="button" id="modeB" aria-pressed="false" data-k="modeB"></button>
      </div>
    </div>
  </header>

  <main class="grid">
    <aside class="panel" id="panel">
      <p class="how" data-k-html="how"></p>

      <div class="sec">
        <h3 data-k="s1"></h3>
        <div class="field">
          <label for="name" data-k="lblName"></label>
          <input type="text" id="name" data-ph="phName" autocomplete="off">
        </div>
        <div class="field">
          <span class="lbl" data-k="lblFormat"></span>
          <div class="chips" id="chips"></div>
        </div>
        <div class="field">
          <label for="price" id="priceLbl"></label>
          <input type="text" id="price" inputmode="numeric" data-ph="phPrice" autocomplete="off">
        </div>
      </div>

      <div class="sec">
        <h3 data-k="s2"></h3>
        <div class="field" id="f-reels"><label for="rReels" data-k="lblReels"></label><input type="text" id="rReels" inputmode="numeric" data-ph="phReach" autocomplete="off"></div>
        <div class="field" id="f-stories"><label for="rStories" data-k="lblStories"></label><input type="text" id="rStories" inputmode="numeric" data-ph="phAsk" autocomplete="off"></div>
        <div class="field" id="f-post"><label for="rPost" data-k="lblPost"></label><input type="text" id="rPost" inputmode="numeric" data-ph="phAsk" autocomplete="off"></div>
        <div class="field" id="f-custom"><label for="rCustom" data-k="lblCustom"></label><input type="text" id="rCustom" inputmode="numeric" data-ph="phCustom" autocomplete="off"></div>
        <p class="note" data-k="reachNote"></p>
      </div>

      <div class="sec">
        <h3 data-k="s3"></h3>
        <div class="two">
          <div class="field"><label for="p" data-k="lblGoal"></label><input type="text" id="p" inputmode="decimal" autocomplete="off"></div>
          <div class="field"><label for="gift" id="giftLbl"></label><input type="text" id="gift" inputmode="numeric" placeholder="0" autocomplete="off"></div>
        </div>
        <div class="field"><label for="ifN" data-k="lblIfN"></label><input type="text" id="ifN" inputmode="numeric" data-ph="phIfN" autocomplete="off"></div>
      </div>

      <div class="hints" id="hints"></div>

      <div class="btns">
        <button type="button" class="btn primary" id="toBlogger" data-k="btnShow"></button>
        <button type="button" class="btn" id="copyBtn" data-k="btnCopy"></button>
        <button type="button" class="btn ghost" id="clearBtn" data-k="btnClear"></button>
      </div>
      <details>
        <summary data-k="sumMsg"></summary>
        <textarea id="msg" rows="14" readonly></textarea>
      </details>

      <details>
        <summary data-k="sumAssume"></summary>
        <div class="sec">
          <div class="three">
            <div class="field"><label for="check" id="checkLbl"></label><input type="text" id="check" inputmode="numeric" autocomplete="off"></div>
            <div class="field"><label for="rate" data-k="lblRate"></label><input type="text" id="rate" inputmode="decimal" autocomplete="off"></div>
            <div class="field"><label for="disc" data-k="lblDisc"></label><input type="text" id="disc" inputmode="decimal" autocomplete="off"></div>
          </div>
          <div class="two">
            <div class="field"><label for="period" data-k="lblPeriod"></label><input type="text" id="period" data-ph="phPeriod" autocomplete="off"></div>
            <div class="field"><label for="cur" data-k="lblCur"></label><input type="text" id="cur" maxlength="4" autocomplete="off"></div>
          </div>
          <p class="note" data-k="curNote"></p>
        </div>
      </details>
    </aside>

    <section class="stage">
      <article class="card" id="card" aria-live="polite"></article>
      <div class="actions">
        <button type="button" class="btn primary" id="saveImg" data-k="btnSave"></button>
        <button type="button" class="btn" id="copyBtn2" data-k="btnCopy"></button>
      </div>
    </section>
  </main>

  <div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="mbox">
      <b id="mTitle"></b>
      <p class="note" id="mNote"></p>
      <img id="mImg" alt="" hidden>
      <textarea id="mText" readonly hidden></textarea>
      <div class="btns">
        <button type="button" class="btn primary" id="mDownload" data-k="mDownload"></button>
        <button type="button" class="btn primary" id="mShare" data-k="mShare" hidden></button>
        <button type="button" class="btn" id="mClose" data-k="mClose"></button>
      </div>
    </div>
  </div>
</div>

/* Money values live in two separate sets: rubles for RU, dollars for EN.
   EN example numbers are the RU ones divided by 81.13 and rounded. */
var DEF={
  name:'',fmt:'reels',lang:'ru',
  reach:{reels:37500,stories:0,post:0,custom:37500},
  ifN:0,rate:20,disc:20,p:3,period:'',

  }
};
function clone(o){return JSON.parse(JSON.stringify(o));}
function load(){
  var s=clone(DEF);
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){
      var o=JSON.parse(raw);
      ['name','fmt','lang','ifN','rate','disc','p','period'].forEach(function(k){if(o[k]!==undefined)s[k]=o[k];});
      if(o.reach)s.reach=Object.assign({},DEF.reach,o.reach);
      if(o.m)['ru','en'].forEach(function(l){
        if(!o.m[l])return;
        s.m[l]=Object.assign({},DEF.m[l],o.m[l]);
        s.m[l].prices=Object.assign({},DEF.m[l].prices,o.m[l].prices||{});
      });
    }
  }catch(e){}
  if(s.lang!=='en')s.lang='ru';
  /* a link like ...index.html?lang=en opens the English version */
  try{
    var m=/(?:[?&#])lang=(en|ru)\b/i.exec(location.search+location.hash);
    if(m)s.lang=m[1].toLowerCase();
  }catch(e){}
  return s;
}
var S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

function M(){return S.m[S.lang];}
function T(k){var d=LANGS[S.lang]||LANGS.ru,v=d[k];return v===undefined?LANGS.ru[k]:v;}
function $(q){return document.querySelector(q);}
function esc(t){return String(t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

/* ---------- number and money formatting follow the language ---------- */
function parse(v){
  var s=String(v).replace(/[\s  ]/g,'');
  if(S.lang==='en')s=s.replace(/,(?=\d{3}(?!\d))/g,'').replace(',','.');
  else s=s.replace(',','.');
  var x=parseFloat(s);return isFinite(x)&&x>0?x:0;
}
function nfmt(n){return Math.round(n).toLocaleString(S.lang==='en'?'en-US':'ru-RU');}
function sym(){var s=String(M().cur||'').trim();return s||'₽';}
function money(n){
  var s=sym(),v=nfmt(n);
  if(S.lang==='en')return s.length===1?s+v:s+' '+v;
  return v+' '+s;
}
function dec(x){
  if(!isFinite(x))return '0';
  var d=x<1?2:(x<10?1:0),r=String(parseFloat(x.toFixed(d)));
  return S.lang==='en'?r:r.replace('.',',');
}
function buys(n){
  if(S.lang==='en')return nfmt(n)+' '+enPlural(n,'purchase','purchases');
  return nfmt(n)+' '+ruPlural(n,['покупка','покупки','покупок']);
}
function nice(x){var l=String(Math.round(x)).length;var p=Math.pow(10,Math.max(0,l-2));return Math.round(x/p)*p;}
function timesStr(m){
  var r=Math.round(m);
  if(S.lang==='en')return (Math.abs(m-r)<0.05?r:dec(m))+'×';
  if(Math.abs(m-r)<0.05)return r+' '+ruPlural(r,['раз','раза','раз']);
  return dec(m)+' раза';
}
function fmtLabel(f){return T('fmt')[f.id];}
function getFmt(){for(var i=0;i<FORMATS.length;i++)if(FORMATS[i].id===S.fmt)return FORMATS[i];return FORMATS[0];}
function price(){return M().prices[S.fmt]||0;}

/* ---------- math ---------- */
function reachFor(fmt){
  var tot=0,miss=[];
  Object.keys(fmt.parts).forEach(function(k){var r=S.reach[k]||0;if(r>0)tot+=fmt.parts[k]*r;else miss.push(k);});
  return {total:tot,miss:miss};
}
function compute(){
  var f=getFmt(),r=reachFor(f),pr=price();
  var unit=M().check*S.rate/100;
  var c={fmt:f,reach:r.total,miss:r.miss,unit:unit,price:pr,ok:r.total>0&&pr>0&&unit>0&&S.p>0};
  if(!c.ok)return c;
  var n=Math.round(c.reach*S.p/1000),rev=n*unit,inc=rev+M().gift;
  c.sc={n:n,rev:rev,inc:inc,mult:rev/pr,every:n>0?c.reach/n:0};
  c.longterm=[3,6,12].map(function(k){return {k:k,total:k*rev};});
  if(S.ifN>0){var m=Math.round(S.ifN);c.mine={n:m,inc:m*unit,mult:m*unit/pr};}
  return c;
}
/* ---------- card ---------- */
function renderCard(c){
  var el=$('#card'),nm=S.name.trim(),B=T('brand');
  if(!c.ok){
    el.innerHTML='<div class="empty"><h2>'+T('empty1')+'</h2><p>'+T('empty2')+'</p></div>';
    return;
  }
  var sc=c.sc,gain=sc.rev-c.price;
  var every=nice(sc.every||c.reach);
  var smax=Math.max(c.price,sc.rev)*1.06;
  function pct(v){return Math.max(0,Math.min(100,v/smax*100));}
  var mark=pct(c.price),wr=pct(sc.rev);
  if(sc.rev>0&&wr<1.5)wr=1.5;
  var up=sc.mult>=1.05;
  var h='';
  h+='<div class="pass">';
  h+='<svg class="arc" viewBox="0 0 210 90" fill="none" aria-hidden="true"><path d="M6 80 C 60 -6, 140 -6, 196 34" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 8"/><circle cx="6" cy="80" r="4" fill="#fff"/><path d="M196 34 l-15 -3 l4 6 l-1 8 l5 -5 l7 4 z" fill="#7CF0C7" transform="rotate(8 196 34)"/></svg>';
  h+='<div class="pass-top"><span>'+esc(B)+(nm?' × '+esc(nm):'')+'</span><span>'+T('offer')+'</span></div>';
  h+='<p class="eyebrow">'+T('eyebrow')(nm?esc(nm):'')+'</p>';
  h+='<div class="hero-num" id="heroNum" data-v="'+Math.round(sc.rev)+'">'+money(sc.rev)+'</div>';
  h+='<p class="hero-sub">'+T('heroSub')+'</p>';
  h+='<div class="hero-tags">'+(up?'<span class="badge">'+T('badgeUp')(sc.mult)+'</span>':'<span class="badge flat">'+T('badgeFlat')(Math.round(sc.mult*100))+'</span>')+(M().gift>0?'<span class="chip-gift">'+T('giftChip')(money(M().gift))+'</span>':'')+'</div>';
  h+='<div class="pass-fields"><div class="pf"><small>'+T('pfFormat')+'</small><b>'+esc(c.fmt.id==='custom'?T('fmtCustomShort'):fmtLabel(c.fmt))+'</b></div>';
  h+='<div class="pf"><small>'+T('pfViews')+'</small><b>'+nfmt(c.reach)+'</b></div>';
  h+='<div class="pf"><small>'+T('pfPrice')+'</small><b>'+money(c.price)+'</b></div></div></div>';

  h+='<div class="cb">';
  h+='<div><p class="sh">'+T('shVs')+'</p>';
  h+='<div class="b-row"><div class="b-head"><span class="b-name">'+T('flat')+'</span><span class="b-val">'+money(c.price)+'</span></div>';
  h+='<div class="b-track"><div class="b-fill"><span class="f-fee" data-w="'+mark.toFixed(2)+'" style="width:'+mark.toFixed(2)+'%"></span></div><i class="b-mark" style="left:'+mark.toFixed(2)+'%"></i></div>';
  h+='<div class="b-foot"><span>'+T('paidOnce')+'</span></div></div>';
  h+='<div class="b-row"><div class="b-head"><span class="b-name">'+esc(T('promo')(B))+'</span><span class="b-val">'+money(sc.rev)+'</span></div>';
  h+='<div class="b-track"><div class="b-fill"><span class="f-rev" data-w="'+wr.toFixed(2)+'" style="width:'+wr.toFixed(2)+'%"></span></div><i class="b-mark" style="left:'+mark.toFixed(2)+'%"></i></div>';
  h+='<div class="b-foot"><span>'+T('buysFoot')(sc.n,every)+'</span>'+(gain>0?'<span class="pill up">'+T('pillUp')(money(gain))+'</span>':'')+'</div></div>';
  h+='<div class="legend"><span><i class="l-line"></i>'+T('legPrice')+'</span><span><i style="background:linear-gradient(90deg,var(--card-a),var(--card-b))"></i>'+T('legPromo')+'</span>'+'</div>';
  if(c.mine)h+='<p class="ifn">'+T('ifn')(c.mine.n,money(c.mine.inc))+'</p>';
  h+='</div>';

  h+='<div><p class="sh">'+T('shHow')+'</p><ol class="steps">';
  h+='<li><span class="n">1</span><div><b>'+T('st1')+'</b><span>'+T('st1s')+'</span></div></li>';
  h+='<li><span class="n">2</span><div><b>'+T('st2')(M().gift>0)+'</b><span>'+T('st2s')(M().gift>0)+'</span></div></li>';
  h+='<li><span class="n">3</span><div><b>'+T('st3')(dec(S.rate))+'</b><span>'+T('st3s')(S.disc>0?dec(S.disc):'')+'</span></div></li>';
  h+='</ol></div>';

  h+='<div><p class="sh">'+T('shMore')+'</p><div class="strip">';
  c.longterm.forEach(function(x){h+='<div class="sp"><small>'+T('spLabel')(x.k)+'</small><b>'+money(x.total)+'</b></div>';});
  h+='</div><p class="strip-note">'+T('stripNote')+'</p></div>';
  h+='</div>';

  h+='<div class="close">';
  if(M().gift>0&&sc.rev>0)h+='<span class="k">'+T('closeK')+'</span><div class="sum"><div><small>'+T('sumPromo')+'</small><b>'+money(sc.rev)+'</b></div><i>+</i><div><small>'+T('sumGift')+'</small><b>'+money(M().gift)+'</b></div><i>=</i><div class="tot"><small>'+T('sumTotal')+'</small><b>'+money(sc.inc)+'</b></div></div>';
  h+='<b>'+T('closeB')+'</b><span>'+T('closeS')(every,money(M().check))+'</span></div>';
  el.innerHTML=h;
}

/* ---------- entrance animation (creator view) ---------- */
function playIn(){
  var reduce=false;
  try{reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}
  if(reduce)return;
  var spans=document.querySelectorAll('#card .b-fill span[data-w]');
  for(var i=0;i<spans.length;i++){spans[i].style.transition='none';spans[i].style.width='0%';}
  void document.body.offsetWidth;
  requestAnimationFrame(function(){
    for(var i=0;i<spans.length;i++){spans[i].style.transition='width .9s cubic-bezier(.2,.8,.2,1)';spans[i].style.width=spans[i].dataset.w+'%';}
  });
  var hero=$('#heroNum');
  if(hero){
    var to=parseFloat(hero.dataset.v)||0,t0=null;
    (function step(ts){
      if(t0===null)t0=ts;
      var k=Math.min(1,(ts-t0)/900),e=1-Math.pow(1-k,3);
      hero.textContent=money(to*e);
      if(k<1)requestAnimationFrame(step);else hero.textContent=money(to);
    })(performance.now());
  }
}

/* ---------- manager hints ---------- */
function hintHTML(list){
  return list.map(function(x){return '<div class="hint"><span class="tag '+x[0]+'">'+x[1]+'</span><span>'+x[2]+'</span></div>';}).join('');
}
function renderHints(c){
  var H=[];
  if(c.price<=0)H.push(['bad',T('hNoPriceT'),T('hNoPrice')]);
  if(c.reach<=0)H.push(['bad',T('hNoReachT'),T('hNoReach')]);
  else if(c.miss.length)H.push(['warn',T('hMissT'),T('hMiss')(c.miss.map(function(k){return T('partGen')[k];}).join(T('and')))]);
  if(S.p<=0)H.push(['bad',T('hNoGoalT'),T('hNoGoal')]);
  $('#hints').innerHTML=hintHTML(H);
}

/* ---------- message text ---------- */
function buildText(c){
  if(!c.ok)return T('msgEmpty');
  var sc=c.sc;
  var L=T('msg')({
    nm:S.name.trim(),brand:T('brand'),custom:c.fmt.id==='custom',label:fmtLabel(c.fmt),
    reach:c.reach,gift:M().gift,rate:S.rate,disc:S.disc,every:nice(sc.every||c.reach),n:sc.n,rev:sc.rev,
    up:sc.mult>=1.05,mult:sc.mult,price:c.price,inc:sc.inc,mine:c.mine,six:c.longterm[1].total,check:M().check
  });
  return L.join('\n').replace(/[  ]/g,' ');
}

/* ---------- inputs ---------- */
var FIELDS=[
  {id:'name',kind:'text',get:function(){return S.name;},set:function(v){S.name=v;}},
  {id:'price',kind:'int',get:function(){return price();},set:function(v){M().prices[S.fmt]=v;}},
  {id:'rReels',kind:'int',get:function(){return S.reach.reels;},set:function(v){S.reach.reels=v;}},
  {id:'rStories',kind:'int',get:function(){return S.reach.stories;},set:function(v){S.reach.stories=v;}},
  {id:'rPost',kind:'int',get:function(){return S.reach.post;},set:function(v){S.reach.post=v;}},
  {id:'rCustom',kind:'int',get:function(){return S.reach.custom;},set:function(v){S.reach.custom=v;}},
  {id:'p',kind:'dec',get:function(){return S.p;},set:function(v){S.p=v;}},
  {id:'gift',kind:'int',get:function(){return M().gift;},set:function(v){M().gift=v;}},
  {id:'ifN',kind:'int',get:function(){return S.ifN;},set:function(v){S.ifN=v;}},
  {id:'check',kind:'int',get:function(){return M().check;},set:function(v){M().check=v;}},
  {id:'rate',kind:'dec',get:function(){return S.rate;},set:function(v){S.rate=v;}},
  {id:'disc',kind:'dec',get:function(){return S.disc;},set:function(v){S.disc=v;}},
  {id:'period',kind:'text',get:function(){return S.period;},set:function(v){S.period=v;}},
  {id:'cur',kind:'text',get:function(){return M().cur;},set:function(v){M().cur=v;}}
];
function showVal(f){
  var v=f.get();
  if(f.kind==='text')return v||'';
  if(!v)return '';
  if(f.kind==='int')return nfmt(v);
  return S.lang==='en'?String(v):String(v).replace('.',',');
}
function syncAll(){
  FIELDS.forEach(function(f){var el=document.getElementById(f.id);if(el&&el!==document.activeElement)el.value=showVal(f);});
  var fm=getFmt(),s=sym();
  ['reels','stories','post','custom'].forEach(function(k){document.getElementById('f-'+k).hidden=!(k in fm.parts);});
  $('#priceLbl').textContent=T('lblPrice')(fmtLabel(fm),s);
  $('#giftLbl').textContent=T('lblGift')(s);
  $('#checkLbl').textContent=T('lblCheck')(s);
  var chips=$('#chips').children;
  for(var i=0;i<chips.length;i++){
    var id=chips[i].dataset.id,pp=M().prices[id];
    chips[i].setAttribute('aria-pressed',id===S.fmt?'true':'false');
    chips[i].firstChild.textContent=T('fmt')[id];
    chips[i].lastChild.textContent=pp?money(pp):T('chipNoPrice');
  }
}
function buildChips(){
  var box=$('#chips');
  FORMATS.forEach(function(f){
    var b=document.createElement('button');
    b.type='button';b.className='chip';b.dataset.id=f.id;
    b.innerHTML='<b></b><span></span>';
    b.addEventListener('click',function(){S.fmt=f.id;syncAll();update();});
    box.appendChild(b);
  });
}
function bindFields(){
  FIELDS.forEach(function(f){
    var el=document.getElementById(f.id);
    el.addEventListener('input',function(){
      f.set(f.kind==='text'?el.value:parse(el.value));
      if(f.id==='price'||f.id==='cur')syncAll();
      update();
    });
    el.addEventListener('blur',function(){el.value=showVal(f);});
  });
}

/* ---------- language ---------- */
function applyLang(){
  var d=document;
  d.documentElement.lang=S.lang;
  d.title=T('title');
  var i,els;
  els=d.querySelectorAll('[data-k]');
  for(i=0;i<els.length;i++){
    els[i].textContent=T(els[i].getAttribute('data-k'));
    if(els[i].tagName==='BUTTON'){delete els[i].dataset.t;clearTimeout(els[i]._t);}
  }
  els=d.querySelectorAll('[data-k-html]');
  for(i=0;i<els.length;i++)els[i].innerHTML=T(els[i].getAttribute('data-k-html'));
  els=d.querySelectorAll('[data-ph]');
  for(i=0;i<els.length;i++){var v=T(els[i].getAttribute('data-ph'));els[i].placeholder=typeof v==='function'?v():v;}
  els=d.querySelectorAll('[data-aria]');
  for(i=0;i<els.length;i++)els[i].setAttribute('aria-label',T(els[i].getAttribute('data-aria')));
  $('#mImg').alt=T('mImgAlt');
  $('#langRu').setAttribute('aria-pressed',S.lang==='ru'?'true':'false');
  $('#langEn').setAttribute('aria-pressed',S.lang==='en'?'true':'false');
  ['saveImg','copyBtn','copyBtn2','clearBtn','toBlogger'].forEach(function(id){var b=document.getElementById(id);if(b){delete b.dataset.t;clearTimeout(b._t);}});
}
function setLang(l){
  if(S.lang===l)return;
  S.lang=l;
  applyLang();syncAll();update();
}

/* ---------- actions ---------- */
function setMode(m){
  $('#app').dataset.mode=m;
  $('#modeM').setAttribute('aria-pressed',m==='manager'?'true':'false');
  $('#modeB').setAttribute('aria-pressed',m==='blogger'?'true':'false');
  try{window.scrollTo(0,0);}catch(e){}
  if(m==='blogger')playIn();
}
function flash(btn,text){
  var old=btn.dataset.t||btn.textContent;btn.dataset.t=old;btn.textContent=text;
  clearTimeout(btn._t);btn._t=setTimeout(function(){btn.textContent=old;delete btn.dataset.t;},1800);
}
function update(){
  save();
  var c=compute();
  renderCard(c);renderHints(c);
  var m=$('#msg');if(m!==document.activeElement)m.value=buildText(c);
}

buildChips();bindFields();applyLang();syncAll();update();
$('#modeM').addEventListener('click',function(){setMode('manager');});
$('#modeB').addEventListener('click',function(){setMode('blogger');});
$('#toBlogger').addEventListener('click',function(){setMode('blogger');});
$('#langRu').addEventListener('click',function(){setLang('ru');});
$('#langEn').addEventListener('click',function(){setLang('en');});
/* ---------- modal ---------- */
var modalUrl=null,modalBlob=null,modalFile=null;
function closeModal(){
  $('#modal').hidden=true;
  var img=$('#mImg');img.removeAttribute('src');img.hidden=true;
  $('#mText').hidden=true;
  if(modalUrl){try{URL.revokeObjectURL(modalUrl);}catch(e){}modalUrl=null;}
  modalBlob=null;modalFile=null;
}
function showText(t){
  $('#mTitle').textContent=T('mTextTitle');
  $('#mNote').textContent=T('mTextNote');
  $('#mImg').hidden=true;
  var ta=$('#mText');ta.hidden=false;ta.value=t;
  $('#mDownload').hidden=true;$('#mShare').hidden=true;
  $('#modal').hidden=false;
  try{ta.focus();ta.select();}catch(e){}
}
function showImage(blob,name){
  modalBlob=blob;
  try{modalFile=new File([blob],name,{type:'image/png'});}catch(e){modalFile=null;}
  modalUrl=URL.createObjectURL(blob);
  $('#mTitle').textContent=T('mImgTitle');
  $('#mNote').textContent=T('mImgNote');
  $('#mText').hidden=true;
  var img=$('#mImg');img.src=modalUrl;img.hidden=false;
  $('#mDownload').hidden=false;
  var canShare=false;
  try{canShare=!!(modalFile&&navigator.canShare&&navigator.canShare({files:[modalFile]}));}catch(e){}
  $('#mShare').hidden=!canShare;
  $('#modal').hidden=false;
}

/* ---------- copy text ---------- */
function copyText(btn){
  var t=buildText(compute());
  function manual(){
    var ok=false,ta=document.createElement('textarea');
    ta.value=t;ta.setAttribute('readonly','');
    ta.style.cssText='position:fixed;left:-9999px;top:0;opacity:0';
    document.body.appendChild(ta);ta.select();
    try{ok=document.execCommand('copy');}catch(e){}
    document.body.removeChild(ta);
    if(ok)flash(btn,T('copied'));else showText(t);
  }
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(function(){flash(btn,T('copied'));},manual);
    }else{manual();}
  }catch(e){manual();}
}
$('#copyBtn').addEventListener('click',function(){copyText(this);});
$('#copyBtn2').addEventListener('click',function(){copyText(this);});

/* ---------- save card as picture ---------- */
function picName(){
  var nm=S.name.trim().replace(/[^0-9A-Za-zА-Яа-яЁё]+/g,'-').replace(/^-+|-+$/g,'');
  return T('fileBase')+(nm?'-'+nm:'')+'.png';
}
function saveImage(btn){
  var c=compute();
  if(!c.ok){flash(btn,T('needData'));return;}
  if(typeof html2canvas!=='function'){flash(btn,T('noLib'));return;}
  btn.dataset.t=btn.dataset.t||btn.textContent;
  btn.textContent=T('preparing');btn.disabled=true;
  function restore(){btn.disabled=false;btn.textContent=btn.dataset.t;}
  var run=function(){
    html2canvas($('#card'),{
      scale:2,backgroundColor:null,useCORS:true,logging:false,windowWidth:1200,
      onclone:function(doc){
        var cl=doc.getElementById('card');
        var fix=doc.createElement('style');
        fix.textContent='#card,#card *{font-variant-numeric:normal!important;text-wrap:wrap!important}';
        doc.head.appendChild(fix);
        cl.style.boxShadow='none';cl.style.margin='0';cl.style.maxWidth='580px';cl.style.width='580px';
        var hero=doc.getElementById('heroNum');
        if(hero){
          hero.style.background='none';hero.style.backgroundImage='none';
          hero.style.color='#EAFFF6';hero.style.webkitTextFillColor='#EAFFF6';
          hero.textContent=money(parseFloat(hero.dataset.v)||0);
        }
        var sp=cl.querySelectorAll('.b-fill span[data-w]');
        for(var i=0;i<sp.length;i++){sp[i].style.transition='none';sp[i].style.width=sp[i].dataset.w+'%';}
        var g=cl.querySelectorAll('.f-gift');
        for(var j=0;j<g.length;j++){g[j].style.background='#B9D0F7';}
        var lg=cl.querySelectorAll('.legend i');
        for(var k=0;k<lg.length;k++){if(/repeating/.test(lg[k].getAttribute('style')||''))lg[k].style.background='#B9D0F7';}
        var tw=doc.createTreeWalker(cl,NodeFilter.SHOW_TEXT),tn;
        while((tn=tw.nextNode())){tn.nodeValue=tn.nodeValue.replace(/[  ]/g,' ');}
        var ps=cl.querySelector('.pass');
        if(ps)ps.style.background='linear-gradient(135deg,#12304D 0%,#0B1F33 70%)';
      }
    }).then(function(cv){
      var P=48,out=document.createElement('canvas');
      out.width=cv.width+P*2;out.height=cv.height+P*2;
      var x=out.getContext('2d');
      x.fillStyle='#EDF1F5';x.fillRect(0,0,out.width,out.height);
      x.shadowColor='rgba(8,25,45,.32)';x.shadowBlur=64;x.shadowOffsetY=22;
      x.drawImage(cv,P,P);
      out.toBlob(function(blob){
        restore();
        if(!blob){flash(btn,T('failed'));return;}
        showImage(blob,picName());
      },'image/png');
    }).catch(function(){restore();flash(btn,T('failed'));});
  };
  var fontsReady=(document.fonts&&document.fonts.ready)?document.fonts.ready:Promise.resolve();
  fontsReady.then(run,run);
}
$('#saveImg').addEventListener('click',function(){saveImage(this);});
$('#mClose').addEventListener('click',closeModal);
$('#modal').addEventListener('click',function(e){if(e.target===this)closeModal();});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#modal').hidden)closeModal();});
$('#mDownload').addEventListener('click',function(){
  if(!modalBlob||!modalUrl)return;
  var a=document.createElement('a');
  a.href=modalUrl;a.download=picName();
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  flash(this,T('dlHint'));
});
$('#mShare').addEventListener('click',function(){
  if(!modalFile)return;
  try{navigator.share({files:[modalFile],title:T('shareTitle')}).catch(function(){});}catch(e){}
});
$('#clearBtn').addEventListener('click',function(){
  S.name='';
  ['ru','en'].forEach(function(l){Object.keys(S.m[l].prices).forEach(function(k){S.m[l].prices[k]=0;});});
  Object.keys(S.reach).forEach(function(k){S.reach[k]=0;});
  S.ifN=0;
  syncAll();update();
  flash(this,T('cleared'));
});
})();
</script>
